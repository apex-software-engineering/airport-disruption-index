name: Attest

# Pins each settled print outside the operator's storage. The attest job reproduces days from the
# public API with read-only access and stamps new attestations with OpenTimestamps. The publish
# job, the only one that can write, appends the files to the attestations branch. Neither job
# holds a storage or deployment secret, so neither can change what it attests.

on:
  schedule:
    # 01:45Z: after yesterday's print settles (00:30Z) and its 01:30Z settlement deadline.
    - cron: '45 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Settled UTC day to attest, YYYY-MM-DD'
        required: true
        type: string

permissions: {}

concurrency:
  group: attest
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  BASE_URL: https://airports.apexsofteng.com
  # Append-only: a ruleset blocks force-pushes and deletion, with no bypass.
  PUBLICATION_BRANCH: attestations
  # A scheduled run reconciles this many days, ending the day before the run was created.
  RECONCILE_DAYS: '7'

jobs:
  attest:
    name: Reproduce, attest and stamp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads the run's creation time, so a re-run of a scheduled run picks the same days.
      actions: read
    outputs:
      status: ${{ steps.attest.outputs.status }}
      branch-exists: ${{ steps.branch.outputs.exists }}
      changed: ${{ steps.changes.outputs.changed }}
      unproven-commits: ${{ steps.commits.outputs.unproven }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history, so a deployed commit can be checked against every public ref.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the OpenTimestamps client
        run: pipx install opentimestamps-client==0.8.0

      - name: Choose the days
        id: days
        env:
          INPUT_DATE: ${{ inputs.date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            through="$INPUT_DATE"
            days=1
          else
            created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            through="$(date -u -d "${created:0:10} -1 day" +%F)"
            days="$RECONCILE_DAYS"
          fi
          if [[ ! "$through" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::'$through' is not a YYYY-MM-DD date"
            exit 1
          fi
          echo "through=$through" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"

      # The branch tip, fetched before anything is checked, so a re-run sees what is published.
      - name: Check out the publication branch
        id: branch
        run: |
          remote="https://github.com/$GITHUB_REPOSITORY"
          status=0
          git ls-remote --exit-code --heads "$remote" "$PUBLICATION_BRANCH" > /dev/null || status=$?
          if [[ $status == 0 ]]; then
            git clone --quiet --single-branch --branch "$PUBLICATION_BRANCH" "$remote" attestations
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ $status == 2 ]]; then
            echo "::notice::$PUBLICATION_BRANCH does not exist yet; this run creates it"
            git init --quiet attestations
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not read $PUBLICATION_BRANCH (git ls-remote exit $status)"
            exit 1
          fi

      # Runs before, and whatever the result of, the day checks. A fresh proof is pending until a
      # calendar's Bitcoin transaction confirms (a few hours); this completes those that have, so
      # they stop needing a calendar. Invalid proofs are reported by the attest step.
      - name: Upgrade pending proofs
        run: |
          shopt -s nullglob
          for proof in attestations/*.ots; do
            ots upgrade "$proof" || echo "$proof: not complete (pending or unreachable calendar)"
          done
          rm -f attestations/*.bak

      # Writes an attestation only on MATCH. Days already attested are verified instead; never
      # rewritten. The exit status is kept so new attestations are still stamped and published
      # before the run fails.
      - name: Reproduce and attest
        id: attest
        env:
          THROUGH: ${{ steps.days.outputs.through }}
          DAYS: ${{ steps.days.outputs.days }}
        run: |
          status=0
          npm run attest -- "$THROUGH" --days "$DAYS" --dir attestations --base-url "$BASE_URL" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check deployed commits are public
        id: commits
        run: |
          unproven=0
          while read -r file; do
            commit="$(jq -r .deployedCommit "attestations/$file")"
            if [[ "$commit" == null ]]; then
              echo "::warning::$file: the deployment did not report its commit"
            elif git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "$file: deployed commit $commit is public"
            else
              echo "::error::$file: deployed commit $commit is not in the public repo"
              unproven=$((unproven + 1))
            fi
          done < <(git -C attestations ls-files --others --exclude-standard -- '*.json')
          echo "unproven=$unproven" >> "$GITHUB_OUTPUT"

      - name: Stamp new attestations
        run: |
          shopt -s nullglob
          for file in attestations/*.json; do
            if [[ ! -e "$file.ots" ]]; then
              ots stamp --timeout 30 "$file"
              ots info "$file.ots"
            fi
          done

      # A freshly stamped proof is parsed again before anything is published.
      - name: Check every proof
        run: npm run check-proofs -- attestations

      # Only what this run wrote or upgraded is published. Other files already on the branch that
      # do not look like attestations are warned about and left alone: the branch cannot delete.
      - name: Collect changes
        id: changes
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}\.r[0-9]+\.json(\.ots)?$'
          while read -r name; do
            [[ "$name" =~ $pattern ]] || echo "::warning::$PUBLICATION_BRANCH holds $name, which is not an attestation file"
          done < <(git -C attestations ls-files)
          mkdir outgoing
          while read -r line; do
            name="${line:3}"
            if [[ ! "$name" =~ $pattern ]]; then
              echo "::error::this run produced $name, which is not an attestation file"
              exit 1
            fi
            echo "$line"
            cp "attestations/$name" outgoing/
          done < <(git -C attestations status --porcelain --untracked-files=all)
          if compgen -G 'outgoing/*' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: attestations
          path: outgoing/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to the attestations branch
    needs: attest
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN can write anywhere in this repo; this job pushes only to the publication branch,
    # and that branch is append-only because of its ruleset, not because of the token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.attest.outputs.changed == 'true'
        with:
          name: attestations
          path: incoming

      - uses: actions/checkout@v5
        if: needs.attest.outputs.changed == 'true' && needs.attest.outputs.branch-exists == 'true'
        with:
          ref: ${{ env.PUBLICATION_BRANCH }}
          path: publication

      - uses: actions/checkout@v5
        if: needs.attest.outputs.changed == 'true' && needs.attest.outputs.branch-exists != 'true'
        with:
          path: publication

      # Appends only: a new attestation needs its proof, an existing one must be byte-identical,
      # and a proof may only be added or upgraded beside its attestation.
      - name: Publish
        if: needs.attest.outputs.changed == 'true'
        env:
          BRANCH_EXISTS: ${{ needs.attest.outputs.branch-exists }}
        run: |
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$BRANCH_EXISTS" != true ]]; then
            git switch --quiet --orphan "$PUBLICATION_BRANCH"
          fi
          shopt -s nullglob
          added=()
          for source in ../incoming/*; do
            name="$(basename "$source")"
            if [[ ! "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.r[0-9]+\.json(\.ots)?$ ]]; then
              echo "::error::unexpected file $name"
              exit 1
            fi
            if [[ "$name" == *.json ]]; then
              if [[ -e "$name" ]]; then
                cmp -s "$source" "$name" || { echo "::error::$name would be rewritten"; exit 1; }
              elif [[ -e "$source.ots" ]]; then
                cp "$source" "$name"
                added+=("${name%.json}")
              else
                echo "::error::$name has no proof"
                exit 1
              fi
            else
              [[ -e "${name%.ots}" || -e "${source%.ots}" ]] || { echo "::error::$name has no attestation"; exit 1; }
              cp "$source" "$name"
            fi
          done
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          if (( ${#added[@]} > 0 )); then
            git commit --quiet -m "Attest ${added[*]}"
          else
            git commit --quiet -m "Upgrade OpenTimestamps proofs"
          fi
          git show --stat --oneline HEAD
          if [[ "$BRANCH_EXISTS" == true ]]; then
            git pull --quiet --rebase origin "$PUBLICATION_BRANCH"
          fi
          git push origin "HEAD:refs/heads/$PUBLICATION_BRANCH"

      # Last, so everything that could be attested is published before the run fails.
      - name: Fail for days not attested or commits not public
        if: needs.attest.outputs.status != '0' || needs.attest.outputs.unproven-commits != '0'
        run: |
          echo "::error::Days not attested, invalid proofs or non-public deployed commits; see the attest job"
          exit 1
