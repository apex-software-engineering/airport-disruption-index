name: Attest

# Pins each settled print outside the operator's storage. The attest job reproduces days from the
# public API with read-only access and stamps new attestations with OpenTimestamps. The publish
# job, the only one that can write, appends the files to the attestations branch. Neither job
# holds a storage or deployment secret, so neither can change what it attests.

on:
  schedule:
    # 01:45Z: after a v1 UTC day settles (00:30Z) and its 01:30Z publication deadline. Kept until
    # 2026-12-31 is attested, then removed in the post-cutover PR.
    - cron: '45 1 * * *'
    # ET days: 05:45Z is after 01:30 EDT, 06:45Z after 01:30 EST. Each date is gated on its own
    # publishBy (scripts/attest.ts), so the run that is early for a date skips it.
    - cron: '45 5 * * *'
    - cron: '45 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Settlement day to attest (its label), YYYY-MM-DD'
        required: true
        type: string

permissions: {}

concurrency:
  group: attest
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  BASE_URL: https://airports.apexsofteng.com
  # Append-only: a ruleset blocks force-pushes and deletion, with no bypass.
  PUBLICATION_BRANCH: attestations
  # A scheduled run reconciles this many days, ending the day before the run was created.
  RECONCILE_DAYS: '7'

jobs:
  attest:
    name: Reproduce, attest and stamp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads the run's creation time, so a re-run of a scheduled run picks the same days.
      actions: read
    outputs:
      status: ${{ steps.attest.outputs.status }}
      branch-exists: ${{ steps.branch.outputs.exists }}
      changed: ${{ steps.changes.outputs.changed }}
      unproven-commits: ${{ steps.commits.outputs.unproven }}
      withheld: ${{ steps.changes.outputs.withheld }}
      stamp-failures: ${{ steps.stamp.outputs.failed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history, so a deployed commit can be checked against every public ref.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the OpenTimestamps client
        run: pipx install opentimestamps-client==0.8.0

      # The run's reference date is the day before its creation date: the UTC date for the legacy
      # 01:45Z trigger, the ET date for the ET triggers. Re-runs keep the run's creation time.
      - name: Choose the days
        id: days
        env:
          INPUT_DATE: ${{ inputs.date }}
          SCHEDULE: ${{ github.event.schedule }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            through="$INPUT_DATE"
            days=1
          else
            created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            if [[ "$SCHEDULE" == '45 1 * * *' ]]; then
              created_date="$(date -u -d "$created" +%F)"
            else
              created_date="$(TZ=America/New_York date -d "$created" +%F)"
            fi
            through="$(date -u -d "$created_date -1 day" +%F)"
            days="$RECONCILE_DAYS"
          fi
          if [[ ! "$through" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::'$through' is not a YYYY-MM-DD date"
            exit 1
          fi
          echo "through=$through" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"

      # The branch tip, fetched before anything is checked, so a re-run sees what is published.
      - name: Check out the publication branch
        id: branch
        run: |
          remote="https://github.com/$GITHUB_REPOSITORY"
          status=0
          git ls-remote --exit-code --heads "$remote" "$PUBLICATION_BRANCH" > /dev/null || status=$?
          if [[ $status == 0 ]]; then
            git clone --quiet --single-branch --branch "$PUBLICATION_BRANCH" "$remote" attestations
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ $status == 2 ]]; then
            echo "::notice::$PUBLICATION_BRANCH does not exist yet; this run creates it"
            git init --quiet attestations
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::could not read $PUBLICATION_BRANCH (git ls-remote exit $status)"
            exit 1
          fi

      # Runs before, and whatever the result of, the day checks. A fresh proof is pending until a
      # calendar's Bitcoin transaction confirms (a few hours); this completes those that have, so
      # they stop needing a calendar. Invalid proofs are reported by the attest step.
      - name: Upgrade pending proofs
        run: |
          shopt -s nullglob
          for proof in attestations/*.ots; do
            ots upgrade "$proof" || echo "$proof: not complete (pending or unreachable calendar)"
          done
          rm -f attestations/*.bak

      # Writes an attestation only on MATCH. Days already attested are verified instead; never
      # rewritten. The exit status is kept so new attestations are still stamped and published
      # before the run fails.
      - name: Reproduce and attest
        id: attest
        env:
          THROUGH: ${{ steps.days.outputs.through }}
          DAYS: ${{ steps.days.outputs.days }}
        run: |
          set -o pipefail
          status=0
          npm run attest -- "$THROUGH" --days "$DAYS" --dir attestations \
            --branch "$PUBLICATION_BRANCH" --base-url "$BASE_URL" | tee attest.log || status=$?
          # Annotated, not blocking: a bad day or an earlier invalid proof never holds back the others.
          sed -n 's/^\([0-9-]*: FAILED: .*\)$/::error::\1/p; s/^INVALID PROOF: \(.*\)$/::error::invalid earlier proof: \1/p' attest.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Check deployed commits are public
        id: commits
        run: |
          unproven=0
          while read -r file; do
            commit="$(jq -r .deployedCommit "attestations/$file")"
            if [[ "$commit" == null ]]; then
              echo "::warning::$file: the deployment did not report its commit"
            elif git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "$file: deployed commit $commit is public"
            else
              echo "::error::$file: deployed commit $commit is not in the public repo"
              unproven=$((unproven + 1))
            fi
          done < <(git -C attestations ls-files --others --exclude-standard -- '*.json')
          echo "unproven=$unproven" >> "$GITHUB_OUTPUT"

      # Per file: one that fails to stamp is reported and left unproven (so it is withheld below),
      # and the others still go out; the run fails at the end.
      - name: Stamp new attestations
        id: stamp
        run: |
          shopt -s nullglob
          failed=0
          for file in attestations/*.json; do
            [[ -e "$file.ots" ]] && continue
            if ots stamp --timeout 30 "$file" && ots info "$file.ots"; then
              echo "stamped $file"
            else
              echo "::error::$file: stamping failed"
              failed=$((failed + 1))
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # Only what this run wrote or upgraded is published, and only after its proof is parsed again
      # and found to commit to its attestation; a file that fails is withheld, the rest go out.
      # Other files already on the branch that do not look like attestations are warned about and
      # left alone.
      - name: Collect and check changes
        id: changes
        run: |
          pattern='^[0-9]{4}-[0-9]{2}-[0-9]{2}\.r[0-9]+\.json(\.ots)?$'
          # Notice readback records are the notice-readback workflow's (notice-readback.yml).
          known='^notices/[0-9]+\.[0-9]+\.[0-9]+\.readback\.json(\.ots)?$'
          while IFS= read -r name; do
            [[ "$name" =~ $pattern || "$name" =~ $known ]] || echo "::warning::$PUBLICATION_BRANCH holds $name, which is not an attestation file"
          done < <(git -C attestations ls-files)
          withheld=0
          changed=()
          # IFS= keeps the leading space of a status such as " M", so the name starts at column 4.
          while IFS= read -r line; do
            name="${line:3}"
            if [[ "$name" =~ $pattern ]]; then
              changed+=("$name")
            else
              echo "::error::this run produced $name, which is not an attestation file; withheld"
              withheld=$((withheld + 1))
            fi
          done < <(git -C attestations status --porcelain --untracked-files=all)
          names=()
          for name in "${changed[@]}"; do names+=("${name%.ots}"); done
          mapfile -t names < <(printf '%s\n' "${names[@]}" | sort -u | sed '/^$/d')
          mkdir outgoing
          if (( ${#names[@]} > 0 )); then
            # Fails closed: a name is published only on an OK line, so a crash withholds everything.
            npm run -s check-proofs -- attestations "${names[@]}" > proofs.log || true
            cat proofs.log
            for name in "${names[@]}"; do
              if ! grep -qxF "OK $name" proofs.log; then
                echo "::error::$name: proof did not pass its check; withheld"
                withheld=$((withheld + 1))
                continue
              fi
              for file in "$name" "$name.ots"; do
                if printf '%s\n' "${changed[@]}" | grep -qx "$file"; then
                  cp "attestations/$file" outgoing/
                fi
              done
            done
          fi
          ls -l outgoing
          echo "withheld=$withheld" >> "$GITHUB_OUTPUT"
          if compgen -G 'outgoing/*' > /dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing new to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          name: attestations
          path: outgoing/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to the attestations branch
    needs: attest
    if: ${{ !cancelled() && needs.attest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GITHUB_TOKEN can write anywhere in this repo; this job pushes only to the publication branch,
    # and that branch is append-only because of its ruleset, not because of the token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        if: needs.attest.outputs.changed == 'true'
        with:
          name: attestations
          path: incoming

      - uses: actions/checkout@v5
        if: needs.attest.outputs.changed == 'true' && needs.attest.outputs.branch-exists == 'true'
        with:
          ref: ${{ env.PUBLICATION_BRANCH }}
          path: publication

      - uses: actions/checkout@v5
        if: needs.attest.outputs.changed == 'true' && needs.attest.outputs.branch-exists != 'true'
        with:
          path: publication

      # Appends only: a new attestation needs its proof, an existing one must be byte-identical,
      # and a proof may only be added or upgraded beside its attestation.
      - name: Publish
        if: needs.attest.outputs.changed == 'true'
        env:
          BRANCH_EXISTS: ${{ needs.attest.outputs.branch-exists }}
        run: |
          cd publication
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$BRANCH_EXISTS" != true ]]; then
            git switch --quiet --orphan "$PUBLICATION_BRANCH"
          fi
          shopt -s nullglob
          added=()
          for source in ../incoming/*; do
            name="$(basename "$source")"
            if [[ ! "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.r[0-9]+\.json(\.ots)?$ ]]; then
              echo "::error::unexpected file $name"
              exit 1
            fi
            if [[ "$name" == *.json ]]; then
              if [[ -e "$name" ]]; then
                cmp -s "$source" "$name" || { echo "::error::$name would be rewritten"; exit 1; }
              elif [[ -e "$source.ots" ]]; then
                cp "$source" "$name"
                added+=("${name%.json}")
              else
                echo "::error::$name has no proof"
                exit 1
              fi
            else
              [[ -e "${name%.ots}" || -e "${source%.ots}" ]] || { echo "::error::$name has no attestation"; exit 1; }
              cp "$source" "$name"
            fi
          done
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          if (( ${#added[@]} > 0 )); then
            git commit --quiet -m "Attest ${added[*]}"
          else
            git commit --quiet -m "Upgrade OpenTimestamps proofs"
          fi
          git show --stat --oneline HEAD
          if [[ "$BRANCH_EXISTS" == true ]]; then
            git pull --quiet --rebase origin "$PUBLICATION_BRANCH"
          fi
          git push origin "HEAD:refs/heads/$PUBLICATION_BRANCH"

      # Last, so everything that could be attested is published before the run fails.
      - name: Fail for anything not attested, proven or published
        if: >-
          needs.attest.outputs.status != '0' || needs.attest.outputs.unproven-commits != '0' ||
          needs.attest.outputs.withheld != '0' || needs.attest.outputs.stamp-failures != '0'
        run: |
          echo "::error::Days not attested, invalid proofs, failed stamps, withheld files or non-public deployed commits; see the attest job"
          exit 1
