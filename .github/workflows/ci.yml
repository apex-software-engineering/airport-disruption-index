name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      # Cutover step 2 (docs/design/v2-eastern-day.md, section 2): once the registry announces v2,
      # its N and B must be the ones the readback record on the attestations branch proves, with
      # the 30-day notice. Passes while v2 is not announced.
      - name: Verify the v2.0.0 notice readback
        run: |
          git clone --quiet --single-branch --branch attestations \
            "https://github.com/$GITHUB_REPOSITORY" attestations
          npm run -s verify-notice -- 2.0.0

      - name: Build
        run: npm run build

      # The runner ships Google Chrome; the suite uses it (channel: chrome) with its sandbox on.
      - name: Home chart against fixture data
        run: npm run test:fixtures
